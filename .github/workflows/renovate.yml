---
# Run self-hosted Renovate against this repository on a schedule.
#
# The Mend Renovate GitHub App is not installed on the org, so nothing else
# runs Renovate. This workflow runs the Renovate CLI with a personal access
# token from the RENOVATE_TOKEN secret (classic PAT with repo + workflow
# scope, or a fine-grained PAT with contents, pull requests, issues and
# workflows read/write). PRs and commits are authored by the token owner.
# The repository config lives in .github/renovate.json.
name: renovate

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f  # v46.3.3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
